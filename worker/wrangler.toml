name = "wx-editor-cron"
main = "cron.js"
compatibility_date = "2024-09-01"

# Cron：每 2 小时同步一次 RSS
[triggers]
crons = ["0 */2 * * *"]

# D1 绑定（与 Pages 项目共用同一个数据库）
[[d1_databases]]
binding = "DB"
database_name = "wechat-articles"
database_id = "07866451-5e7a-4b0c-995c-069b1eb31ff2"

# 部署：cd worker && wrangler deploy
